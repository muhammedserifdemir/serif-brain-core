name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # node:sqlite + native test runner Node 22.5+ ister.
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test (node --test)
        run: node --test test/*.test.mjs
      - name: Doctor (kendi brain'i üzerinde duman testi)
        run: node ./bin/serif-brain.mjs doctor || true
      - name: CLI smoke (help + version)
        run: |
          node ./bin/serif-brain.mjs --help
          node ./bin/serif-brain.mjs --version
