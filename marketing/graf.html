<!doctype html><meta charset="utf-8"><title>graf</title>
<style>html,body{margin:0;background:#0F172A;overflow:hidden}canvas{display:block}</style>
<canvas id="c" width="1600" height="1000"></canvas>
<script>
// GERCEK kod grafi (serif-platform): 2537 dugum / 11580 kenar.
// Etiketler, dosya yollari ve modul adlari CIKARILDI — yalnizca yapi ve
// yogunluk gosteriliyor. Musteri/proje kimligi sizmaz.
fetch("graf.json").then(r=>r.json()).then(ciz);

function ciz(D){
  const c=document.getElementById("c"), x=c.getContext("2d"), W=1600, H=1000;
  const N=D.grup.length, P=new Float32Array(N*2), V=new Float32Array(N*2);
  let s=42; const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<N;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*440;
    P[i*2]=W/2+Math.cos(a)*r; P[i*2+1]=H/2+Math.sin(a)*r;}

  const deg=new Int32Array(N);
  for(const[a,b] of D.kenar){deg[a]++;deg[b]++;}

  // Kuvvet yerlesimi. Yalniz "merkezden itme" denendi ve dugumleri bir kenara
  // yigdi; gercek ayrisma icin DUGUM-DUGUM itme sart. Hepsini ciftler halinde
  // hesaplamak O(n^2) (2537 dugum → 6.4M islem/adim) oldugundan izgara
  // kullaniliyor: her hucrenin agirlik merkezi tek bir itici kutle sayilir.
  const HUC = 46;                       // hucre kenari (px)
  for(let it=0; it<420; it++){
    const cek = it<260 ? 0.0022 : 0.0009;
    for(const[a,b] of D.kenar){
      const dx=P[b*2]-P[a*2], dy=P[b*2+1]-P[a*2+1];
      V[a*2]+=dx*cek; V[a*2+1]+=dy*cek; V[b*2]-=dx*cek; V[b*2+1]-=dy*cek;
    }

    // Izgarayi doldur (agirlik merkezleri)
    const kut = new Map();
    for(let i=0;i<N;i++){
      const gx=Math.floor(P[i*2]/HUC), gy=Math.floor(P[i*2+1]/HUC);
      const key=gx*100000+gy;
      let c=kut.get(key);
      if(!c){ c={x:0,y:0,n:0}; kut.set(key,c); }
      c.x+=P[i*2]; c.y+=P[i*2+1]; c.n++;
    }
    const hucreler=[...kut.values()];
    for(const c of hucreler){ c.x/=c.n; c.y/=c.n; }

    const itme = it<260 ? 190 : 90;
    for(let i=0;i<N;i++){
      let fx=0, fy=0;
      for(const c of hucreler){
        const dx=P[i*2]-c.x, dy=P[i*2+1]-c.y, d2=dx*dx+dy*dy+80;
        const f=itme*c.n/d2;
        fx+=dx*f; fy+=dy*f;
      }
      // hafif merkez cekimi — graf dagilip tuvali terk etmesin
      fx += (W/2-P[i*2])*0.0012; fy += (H/2-P[i*2+1])*0.0012;
      V[i*2]+=fx*0.02; V[i*2+1]+=fy*0.02;
      V[i*2]*=0.86; V[i*2+1]*=0.86;
      P[i*2]+=V[i*2]; P[i*2+1]+=V[i*2+1];
    }
  }

  // Yerlesim sonrasi NORMALIZASYON: simulasyon merkezden kayabiliyor ve
  // dugumler bir kenara yigiliyordu. Sinir kutusu hesaplanip tuvale oturtulur
  // (yuzde 2 ucta kirpma ile aykiri dugumler cerceveyi bozmasin).
  const xs=[], ys=[];
  for(let i=0;i<N;i++){ xs.push(P[i*2]); ys.push(P[i*2+1]); }
  xs.sort((a,b)=>a-b); ys.sort((a,b)=>a-b);
  const q=(arr,p)=>arr[Math.floor(arr.length*p)];
  const x0=q(xs,.02), x1=q(xs,.98), y0=q(ys,.02), y1=q(ys,.98);
  const pad=70;
  const sc=Math.min((W-pad*2)/Math.max(x1-x0,1), (H-pad*2)/Math.max(y1-y0,1));
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  for(let i=0;i<N;i++){
    P[i*2]   = W/2 + (P[i*2]  -cx)*sc;
    P[i*2+1] = H/2 + (P[i*2+1]-cy)*sc;
  }

  const REN=["#38BDF8","#22C55E","#A78BFA","#F59E0B","#F472B6","#2DD4BF","#FB7185","#818CF8","#64748B"];
  x.fillStyle="#0F172A"; x.fillRect(0,0,W,H);
  x.globalCompositeOperation="lighter";
  x.lineWidth=0.35;
  for(const[a,b] of D.kenar){
    x.strokeStyle=REN[D.grup[a]]+"16";
    x.beginPath(); x.moveTo(P[a*2],P[a*2+1]); x.lineTo(P[b*2],P[b*2+1]); x.stroke();
  }
  for(let i=0;i<N;i++){
    const r=1.1+Math.min(Math.sqrt(deg[i])*0.72, 7);
    x.fillStyle=REN[D.grup[i]]+"cc";
    x.beginPath(); x.arc(P[i*2],P[i*2+1],r,0,6.283); x.fill();
  }
  document.title="hazir";
}
</script>
